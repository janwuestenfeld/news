# News Pulse page: started by the collect loop after every 5-minute cycle (collector/loop.sh), today's readings at the current clock and the front page.
# State: the nightly state (actions cache "night-<date>", written by the nightly workflow) plus a small run state
# (cache "run-<date>-<run id>"). Today's posts: the collection chunks in the release raw-<New York date>.
# Log: per step only seconds, peak memory, status and counts (logs/steps.jsonl); never post text.
# 10 Nov (launch): labeller v6 head (model_v6) from the release engine-files; the minute step runs inside run_live.py;
# the run state carries today's line files and the minute files (live/state_io.py). Concurrency: one build at a time;
# a build dispatched while one runs waits, and a newer dispatch replaces a waiting one (never two at once).
name: build
on:
  workflow_dispatch: {}
permissions: {contents: write, pages: write, id-token: write, actions: write}   # contents: write: the raw-<date> and engine-files releases are drafts
concurrency: {group: pipeline, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: {name: github-pages, url: "${{ steps.deploy.outputs.page_url }}"}
    env: {GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}", WIM_HOME: "${{ github.workspace }}/pipeline/home/", WIM_SNAP: "${{ github.workspace }}/pipeline/conf/snapshot", TZ: America/New_York, OMP_NUM_THREADS: "2", WIM_THREADS: "2", PYTHONDONTWRITEBYTECODE: "1"}
    steps:
      - uses: actions/checkout@v4      # engine code from the private repository (read-only deploy key)
        with: {repository: janwuestenfeld/news-engine, ssh-key: "${{ secrets.ENGINE_DEPLOY_KEY }}", path: pipeline, fetch-depth: 1}
      - id: d
        run: echo "day=$(date +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Restore Python packages
        id: venv
        uses: actions/cache@v4
        with: {path: venv, key: "venv-${{ runner.os }}-${{ hashFiles('pipeline/requirements_live.txt') }}-torch2.15.0"}
      - name: Install Python packages (first time only)
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv venv
          venv/bin/pip install -q torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          venv/bin/pip install -q -r pipeline/requirements_live.txt
      - run: echo "$PWD/venv/bin" >> "$GITHUB_PATH"
      - name: Restore nightly state
        id: night
        uses: actions/cache/restore@v4
        with: {path: live, key: "night-${{ steps.d.outputs.day }}", restore-keys: "night-"}
      - name: Stop if there is no nightly state yet
        if: steps.night.outputs.cache-matched-key == ''
        run: |
          echo "No nightly state yet. Run the workflow nightly once (it starts from the release engine-files)."
          exit 1
      - name: Day of the nightly state
        id: sd
        run: echo "day=$(cat live/state_day.txt)" >> "$GITHUB_OUTPUT"   # = today; after midnight until the nightly ends: yesterday (finished at 24:00 by run_live.py)
      - name: Restore run state of that day
        uses: actions/cache/restore@v4
        with: {path: run_state, key: "run-${{ steps.sd.outputs.day }}-${{ github.run_id }}", restore-keys: "run-${{ steps.sd.outputs.day }}-"}
      - name: Restore labeller model
        id: model
        uses: actions/cache/restore@v4
        with: {path: pipeline/labeller/model_v2, key: labeller-model-v2}
      - name: Fetch labeller model (first time only)
        if: steps.model.outputs.cache-hit != 'true'
        env: {ENGINE_KEY: "${{ secrets.ENGINE_KEY }}"}
        run: |
          gh release download engine-files -p "model_v2.tar.gz.enc" -D /tmp
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ENGINE_KEY -in /tmp/model_v2.tar.gz.enc | tar xz -C pipeline/labeller
      - name: Save labeller model
        if: steps.model.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: {path: pipeline/labeller/model_v2, key: labeller-model-v2}
      - name: Restore labeller v6 head
        id: model6
        uses: actions/cache/restore@v4
        with: {path: pipeline/labeller/model_v6, key: labeller-model-v6}
      - name: Fetch labeller v6 head (first time only)
        if: steps.model6.outputs.cache-hit != 'true'
        env: {ENGINE_KEY: "${{ secrets.ENGINE_KEY }}"}
        run: |
          gh release download engine-files -p "model_v6.tar.gz.enc" -D /tmp
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ENGINE_KEY -in /tmp/model_v6.tar.gz.enc | tar xz -C pipeline/labeller
          test -f pipeline/labeller/model_v6/meta.json
      - name: Save labeller v6 head
        if: steps.model6.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: {path: pipeline/labeller/model_v6, key: labeller-model-v6}
      - name: Today's posts
        run: |
          mkdir -p chunks
          python pipeline/live/state_io.py restore run_state live
          gh release download "raw-${{ steps.sd.outputs.day }}" -p "chunk_*.jsonl.gz" -D chunks || echo "no chunks yet for that day"
          # RFIX20 (V20-02): a chunk that fails the gzip test is downloaded once more; if it is still damaged, ingest.py uses its
          # complete lines and logs it (damaged_chunks in the collect step's line); the build goes on
          for f in chunks/*.jsonl.gz; do [ -f "$f" ] || continue; gzip -t "$f" 2>/dev/null && continue
            echo "::warning title=damaged chunk::$(basename "$f") fails the gzip test; downloading it once more"
            gh release download "raw-${{ steps.sd.outputs.day }}" -p "$(basename "$f")" -D chunks --clobber || true; done
      - name: Update (counts, status, seconds and memory per step only)
        run: python pipeline/run_live.py --live "$PWD/live" --chunks "$PWD/chunks"
      - name: Save run state
        if: always()
        run: python pipeline/live/state_io.py save live run_state
      - uses: actions/cache/save@v4
        if: always()
        with: {path: run_state, key: "run-${{ steps.sd.outputs.day }}-${{ github.run_id }}"}
      - name: Page files only
        run: |
          mkdir -p _site && cd live/site
          cp index.html history.html ../../_site/ 2>/dev/null || true
          # history.html is rebuilt by the nightly; until then fix the stale nav label (no-op once regenerated)
          sed -i 's|methodology.html">Methods<|methodology.html">Methodology<|' ../../_site/history.html 2>/dev/null || true
          cp -R data archive ../../_site/ 2>/dev/null || true
          [ -f ../../pipeline/site/methodology.html ] && cp ../../pipeline/site/methodology.html ../../_site/ || true
          ls ../../_site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
      - id: deploy
        uses: actions/deploy-pages@v4
