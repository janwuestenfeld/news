# Collection test: every 5 minutes fetch every source's new posts. Nothing is published to the page.
# Log: per source only platform, HTTP status, new posts, requests, seconds. Raw posts go to the DRAFT release "raw-<New York date>" (drafts are visible only to the owner)
# as one chunk per run (never into git history); the per-source position (ids, times, no text) to the release "collector-state".
name: collect
on:
  schedule: [{cron: "*/5 * * * *"}]
  workflow_dispatch: {}
permissions: {contents: write}
concurrency: {group: collect, cancel-in-progress: false}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env: {GH_TOKEN: "${{ github.token }}", TZ: America/New_York}
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: "collector\ncollect", fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: collector/requirements.txt}
      - name: Install
        run: pip install -q -r collector/requirements.txt
      - name: Restore position per source
        run: |
          mkdir -p run/out
          gh release download collector-state -p state.json -D run || echo "no saved state: starting from seed_state.json"
      - name: Collect (counts, status and seconds only)
        run: python collector/collect_run.py --state run/state.json --out run/out --budget 240
      - name: Store raw posts as a release asset
        run: |
          D=$(date +%F)
          if ls run/out/chunk_*.jsonl.gz >/dev/null 2>&1; then
            if ! gh release list --limit 300 --json tagName -q '.[].tagName' | grep -qx "raw-$D"; then
              gh release create "raw-$D" --draft --title "Raw posts $D" --notes "Collection chunks of $D (New York date of the run); merged after midnight into raw_$D.jsonl.gz. Draft: visible only to the owner."
            fi
            for i in 1 2 3 4 5; do gh release upload "raw-$D" run/out/chunk_*.jsonl.gz --clobber && break; sleep 5; done
          fi
      - name: Save position per source
        run: |
          gh release view collector-state >/dev/null 2>&1 || gh release create collector-state --prerelease --title "Collector state" --notes "Last id / time per source and source health (no post text). Replaced every run."
          cp run/out/state_new.json run/out/state.json
          gh release upload collector-state run/out/state.json run/out/health.json --clobber
