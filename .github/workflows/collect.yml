# Collection: every 5 minutes fetch every source's new posts. Nothing is published to the page.
# One job runs ~5h40m and collects every 5 minutes (collector/loop.sh), then starts the next job itself.
# The schedule is only a restart in case the chain breaks; the concurrency group keeps one job at a time.
# Raw posts go to the DRAFT release "raw-<New York date>" (visible only to the owner), one chunk per cycle (never into
# git history); the per-source position (ids, times, no text) to the release "collector-state".
name: collect
on:
  schedule: [{cron: "*/30 * * * *"}]
  workflow_dispatch: {inputs: {loop_min: {description: "minutes this job keeps collecting (test: 6)", required: false}}}
permissions: {contents: write, actions: write}
concurrency: {group: collect, cancel-in-progress: false}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env: {GH_TOKEN: "${{ github.token }}", TZ: America/New_York, LOOP_MIN: "${{ inputs.loop_min || '340' }}"}
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: "collector\ncollect", fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: collector/requirements.txt}
      - name: Install
        run: pip install -q -r collector/requirements.txt
      - name: Collect every 5 minutes (counts, status and seconds only)
        run: bash collector/loop.sh
