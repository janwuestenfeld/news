# News Pulse nightly job, 03:00 New York (08:00 UTC; 04:00 in summer time): finishes yesterday (history rebuild,
# day files, companion numbers, data export, history page, archive page) and stores the state for today's runs.
# First run: no stored state yet -> starts from the release engine-seed (made once on Jan's Mac).
name: nightly
on:
  schedule: [{cron: "0 8 * * *"}]
  workflow_dispatch: {inputs: {day: {description: "finished New York date YYYY-MM-DD (default: yesterday)", required: false}}}
permissions: {contents: write, pages: write, id-token: write, actions: write}   # contents: write: the raw-<date> and engine-files releases are drafts
concurrency: {group: pipeline, cancel-in-progress: false}
jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: {name: github-pages, url: "${{ steps.deploy.outputs.page_url }}"}
    env: {GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}", WIM_HOME: "${{ github.workspace }}/pipeline/home/", WIM_SNAP: "${{ github.workspace }}/pipeline/conf/snapshot", TZ: America/New_York, OMP_NUM_THREADS: "2", WIM_THREADS: "2", PYTHONDONTWRITEBYTECODE: "1"}
    steps:
      - uses: actions/checkout@v4      # engine code from the private repository (read-only deploy key)
        with: {repository: janwuestenfeld/news-engine, ssh-key: "${{ secrets.ENGINE_DEPLOY_KEY }}", path: pipeline, fetch-depth: 1}
      - id: d
        run: |
          F="${{ github.event.inputs.day }}"; [ -n "$F" ] || F=$(date -d yesterday +%F)
          echo "fin=$F" >> "$GITHUB_OUTPUT"; echo "today=$(date -d "$F + 1 day" +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Restore Python packages
        id: venv
        uses: actions/cache@v4
        with: {path: venv, key: "venv-${{ runner.os }}-${{ hashFiles('pipeline/requirements_live.txt') }}-torch2.15.0"}
      - name: Install Python packages (first time only)
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv venv
          venv/bin/pip install -q torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          venv/bin/pip install -q -r pipeline/requirements_live.txt
      - run: echo "$PWD/venv/bin" >> "$GITHUB_PATH"
      - name: Restore last nightly state
        id: night
        uses: actions/cache/restore@v4
        with: {path: live, key: "night-${{ steps.d.outputs.fin }}", restore-keys: "night-"}
      - name: First run only - start from the seed
        if: steps.night.outputs.cache-matched-key == ''
        env: {ENGINE_KEY: "${{ secrets.ENGINE_KEY }}"}
        run: |
          gh release download engine-files -p "engine_seed.tar.gz.enc" -D /tmp
          mkdir -p live && openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ENGINE_KEY -in /tmp/engine_seed.tar.gz.enc | tar xz -C live
          rm /tmp/engine_seed.tar.gz.enc
      - name: Restore the finished day's last run state (new labels)
        uses: actions/cache/restore@v4
        with: {path: run_state, key: "run-${{ steps.d.outputs.fin }}-last", restore-keys: "run-${{ steps.d.outputs.fin }}-"}
      - name: Restore labeller model
        id: model
        uses: actions/cache/restore@v4
        with: {path: pipeline/labeller/model_v2, key: labeller-model-v2}
      - name: Fetch labeller model (first time only)
        if: steps.model.outputs.cache-hit != 'true'
        env: {ENGINE_KEY: "${{ secrets.ENGINE_KEY }}"}
        run: |
          gh release download engine-files -p "model_v2.tar.gz.enc" -D /tmp
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ENGINE_KEY -in /tmp/model_v2.tar.gz.enc | tar xz -C pipeline/labeller
      - name: The finished day's posts
        run: |
          python pipeline/live/state_io.py restore run_state live
          mkdir -p fin_chunks
          gh release download "raw-${{ steps.d.outputs.fin }}" -p "*.jsonl.gz" -D fin_chunks || echo "no posts released for that day"
      - name: Nightly (counts, status, seconds and memory per step only)
        run: python pipeline/nightly.py --live live --day "${{ steps.d.outputs.fin }}" --chunks fin_chunks
      - name: Store state for today's runs
        uses: actions/cache/save@v4
        with: {path: live, key: "night-${{ steps.d.outputs.today }}"}
      - name: Page files only
        run: |
          mkdir -p _site && cd live/site
          cp index.html history.html ../../_site/ 2>/dev/null || true
          cp -R data archive ../../_site/ 2>/dev/null || true
          [ -f ../../pipeline/site/methodology.html ] && cp ../../pipeline/site/methodology.html ../../_site/ || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
      - id: deploy
        uses: actions/deploy-pages@v4
