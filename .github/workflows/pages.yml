name: pages
on:
  push:
    branches: [main]
    paths: ["index.html", "history.html", "methodology.html", "data/**", ".github/workflows/pages.yml"]
  workflow_dispatch: {}
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - name: Page files only (no collector code on the site)
        run: mkdir _site && cp -R index.html history.html methodology.html data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: "_site"}
      - id: d
        uses: actions/deploy-pages@v4
